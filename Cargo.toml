[package]
version = "1.3.0-beta.1"
name = "bed-reader"
description = "Read and write the PLINK BED format, simply and efficiently."
repository = "https://github.com/fastlmm/bed-reader"
readme = "README-rust.md"
documentation = "https://docs.rs/bed-reader/latest/bed_reader/"
authors = ["FaST-LMM Team <fastlmm-dev@python.org>"]
license = "Apache-2.0" # toml-ignore
keywords = ["bioinformatics", "plink", "genomics", "genotype", "snps"]
categories = ["science"]
edition = "2021"
# 1.95 for the optional GPU support (CubeCL needs Rust 1.95).
rust-version = "1.95"
# When refreshing Cargo.lock, retain one ndarray 0.16.1 shared with numpy.
homepage = "https://fastlmm.github.io/"
exclude = [
    "**/tests/data/*",
    "doc/build/*",
    "docs/*",
    "_static/*",
    "target/*",
    "**/target/debug/*",
    "**/_static/fonts/*",
    "**/_static/css/*",
]

[lib]
name = "bed_reader"
crate-type = ["cdylib", "rlib"]

[package.metadata.docs.rs]
# Document the GPU API too. `cubecl-cuda` builds without a CUDA toolkit (cudarc `fallback-latest`).
features = ["cubecl-cuda"]

# https://github.com/PyO3/pyo3/discussions/2271
# https://pyo3.rs/latest/faq.html#i-cant-run-cargo-test-or-i-cant-build-in-a-cargo-workspace-im-having-linker-issues-like-symbol-not-found-or-undefined-reference-to-_pyexc_systemerror
[features]
default = ["tokio"]
tokio = ["dep:tokio"]
extension-module = ["pyo3/extension-module", "tokio"]
# GPU-resident reading and standardizing (CubeCL) on NVIDIA GPUs. CubeCL 0.11 downloads a prebuilt
# LLVM while building, which does not exist for Windows ARM or Intel macOS (neither has CUDA), so
# this feature, and `--all-features`, cannot build there.
cubecl-cuda = ["cubecl", "cubecl/cuda", "dep:cudarc"]
# Shared GPU code; enable through `cubecl-cuda`.
cubecl = ["dep:cubecl", "dep:cubecl-runtime", "dep:pollster", "dep:bytemuck"]
# Internal, not public API: run this crate's own CubeCL kernel tests on CubeCL's CPU (LLVM)
# runtime, so CI without a GPU can test them. Only `cfg(test)` code switches to the CPU device;
# the library's CubeCL backend stays CUDA-only.
# TODO0 experiment (2026-11-19): decide go/no-go before release; remove if no-go.
_cubecl-cpu-test = ["cubecl-cuda", "cubecl/cpu"]

[dependencies]
thiserror = "1.0.66"
num-traits = "0.2.19"
ndarray-npy = { version = "0.9.1", default-features = false }
rayon = "1.10.0"
numpy = "0.30.0"
ndarray = { version = "0.16.1", features = ["approx", "rayon"] }
statrs = "0.17.1"
byteorder = { version = "1.5.0", default-features = false }
dpc-pariter = "0.4.0"                                                           # //  pariter = "0.5.1"
derive_builder = "0.20.2"
anyinput = { version = "0.1.8", features = ["ndarray"] }
fetch-data = "0.2.0"
futures-util = { version = "0.3.31" }
bytecount = { version = "0.6.8" }
itertools = { version = "0.13.0" }
bytes = { version = "1.11.1" }
cloud-file = { version = "0.3.1" }
pyo3 = { version = "0.30.1", features = ["extension-module"], optional = true }
tokio = { version = "1.42.1", features = ["full"], optional = true }
# CubeCL is alpha, with breaking changes between minor versions: pin exact versions.
cubecl = { version = "=0.11.3", default-features = false, features = ["std", "stdlib"], optional = true }
cubecl-runtime = { version = "=0.11.3", default-features = false, optional = true }
cudarc = { version = "0.19.6", default-features = false, features = ["std", "driver", "fallback-dynamic-loading", "cuda-version-from-build-system"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }

[dev-dependencies]
ndarray-rand = "0.15.0"
anyhow = "1.0.92"
rusoto_credential = "0.48.0"
temp_testdir = "0.2.3"
thousands = "0.2.0"


[build-dependencies]
pyo3-build-config = "0.30.1"
