name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:  # This allows manual triggering of the workflow

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rust-src

      - name: Setup, Lint, and Test Python
        run: |
          uv sync --frozen --all-extras
          source .venv/bin/activate
          sphinx-build --version  # Verify Sphinx is installed

      - name: Build the Sphinx documentation
        working-directory: ./doc
        run: |
          source ../.venv/bin/activate
          make html SPHINXOPTS="-W --keep-going -E -a"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/build/html
