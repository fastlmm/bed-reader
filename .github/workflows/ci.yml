# This file was originally generated by maturin v0.14.17

name: CI3

on:
  push:
  schedule:
    - cron: '0 0 1 * *'
  pull_request:
  workflow_dispatch:
    
env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSIONS: |
    3.11
    3.12
    3.13
    3.14
    3.15
  PYTHON_VERSIONS_ARGS: "-i python3.11 -i python3.12 -i python3.13 -i python3.14 -i python3.15"

permissions:
  contents: read

jobs:

  test_rust:
    name: Test Rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust (Pinned Version)
        uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0
        with:
          components: clippy, rustfmt, rust-src
      - name: Run Clippy (strict for this pinned version of Rust)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Set up Rust (Latest Stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt, rust-src
      - name: Run Clippy (lenient for latest version)
        run: cargo clippy --locked --all-targets --all-features
      - name: Test Rust no-default-features
        run: cargo test --locked --verbose --no-default-features
      - name: Test Rust default features
        run: cargo test --locked --verbose
  
  
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            os: macos-15-intel
            deployment-target: "10.12"
          - target: aarch64
            os: macos-15
            deployment-target: "11.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSIONS }}
      - name: Build wheels
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist ${{ env.PYTHON_VERSIONS_ARGS }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
          
  linux:
    # Native runners keep host build scripts and target C compilers aligned.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            os: ubuntu-latest
          - target: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSIONS }}

      - name: Build wheels
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist ${{ env.PYTHON_VERSIONS_ARGS }}
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSIONS }}
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist ${{ env.PYTHON_VERSIONS_ARGS }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist
        
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build sdist
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  merge_artifacts:
    name: Merge Artifacts
    needs: [macos, linux, windows, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Create merged directory
        run: mkdir -p merged_dist
        
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          pattern: wheels-*
          merge-multiple: true
          
      - name: List downloaded artifacts
        run: find artifacts -type f | sort
        
      - name: Copy artifacts to merged directory
        run: cp -r artifacts/* merged_dist/
        
      - name: Upload merged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-all
          path: merged_dist

  test_python:
    name: Test Python
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: clippy, rustfmt, rust-src
    - name: Install Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "0.12.24"
    - name: Pinned Ruff
      run:  uvx ruff@0.17.5 check bed_reader
    - name: Install minimal dependencies
      run: uv sync --frozen --extra min_dev
    - name: Run min tests
      shell: bash
      run: |
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          source .venv/bin/activate
        else
          source .venv/Scripts/activate
        fi
        pytest bed_reader/tests/test_opt_dep.py  
    - name: Install all dependencies
      run: uv sync --frozen --all-extras
    - name: Run all tests
      shell: bash
      run: |
        if [[ "$RUNNER_OS" != "Windows" ]]; then
          source .venv/bin/activate
        else
          source .venv/Scripts/activate
        fi
        pytest .


  artifact-test:
    name: Installed wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: merge_artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
        python-version: ["3.11", "3.15"]
    steps:
      - name: Checkout test sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.24"

      - name: Download built distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheels-all
          path: artifact

      - name: Install an exact compatible wheel
        run: |
          uv venv --python ${{ matrix.python-version }} .artifact-venv
          uv pip install --python .artifact-venv --no-index --no-deps --only-binary :all: --find-links artifact bed-reader
          uv pip install --python .artifact-venv "bed-reader[samples,sparse,dev]"

      - name: Test outside the source checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import pathlib, shutil, sys; shutil.copytree(pathlib.Path(sys.argv[1]) / 'bed_reader' / 'tests', pathlib.Path(sys.argv[2]) / 'bed_reader_artifact_tests')" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          uv run --no-project --python "$GITHUB_WORKSPACE/.artifact-venv" python -c "import bed_reader; assert '.artifact-venv' in bed_reader.__file__; print(bed_reader.__file__)"
          uv run --no-project --python "$GITHUB_WORKSPACE/.artifact-venv" python -m pytest --import-mode=importlib --doctest-modules "$RUNNER_TEMP/bed_reader_artifact_tests"

  sdist-test:
    name: Source distribution (Python ${{ matrix.python-version }})
    needs: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - name: Checkout test sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.24"

      - name: Download source distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheels-sdist
          path: artifact

      - name: Build and install from the source distribution
        run: |
          uv build --wheel --python ${{ matrix.python-version }} --no-sources --out-dir sdist-wheel artifact/*.tar.gz
          uv venv --python ${{ matrix.python-version }} .artifact-venv
          uv pip install --python .artifact-venv --no-index --no-deps --only-binary :all: --find-links sdist-wheel bed-reader
          uv pip install --python .artifact-venv "bed-reader[samples,sparse,dev]"

      - name: Test outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import pathlib, shutil, sys; shutil.copytree(pathlib.Path(sys.argv[1]) / 'bed_reader' / 'tests', pathlib.Path(sys.argv[2]) / 'bed_reader_artifact_tests')" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          uv run --no-project --python "$GITHUB_WORKSPACE/.artifact-venv" python -c "import bed_reader; assert '.artifact-venv' in bed_reader.__file__; print(bed_reader.__file__)"
          uv run --no-project --python "$GITHUB_WORKSPACE/.artifact-venv" python -m pytest --import-mode=importlib --doctest-modules "$RUNNER_TEMP/bed_reader_artifact_tests"
